[package]
name = "blob-app"
version = "0.4.0"
description = "Blob for desktop and phones: a native shell around blob.bojes.org"
authors = ["Blob"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.90"

[lib]
# The mobile apps load the library; the desktop binary (main.rs) calls into it.
name = "blob_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# The native webviews, for what Tauri doesn't offer itself (swipe back/forward, printing on iPhone).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_24"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
# Updates (src/update.rs): downloads with the system's certificates and proxy, checked by SHA-256.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Unpacking the new Blob.app.
flate2 = "1"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
