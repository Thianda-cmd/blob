# Builds and tests the Blob apps (src-tauri/), and publishes them on a tag.
#
# - Every push that changes the app (src-tauri/, this file): build every app and test it as an app:
#   Linux and Windows through WebDriver (src-tauri/tests/e2e/desktop.mjs), macOS with a smoke test,
#   Android in an emulator (android.mjs), iOS in the simulator (ios.sh). Installers, APK and
#   screenshots are workflow artifacts for 14 days.
# - A tag like app-v0.1.0: the same, then a GitHub release with the installers and the APK, once the
#   builds and their tests have passed.
# - By hand: Actions → Apps → Run workflow; tick "release" to publish app-v<version> from that
#   commit the same way (GitHub then creates the tag).
#
# Not signed by a store yet (docs/native-apps.md): Windows shows SmartScreen; the Mac app is only
# ad-hoc signed, so macOS asks for Privacy & Security → Open Anyway the first time (without any
# signature it would call the app damaged). The APK is signed with secrets.ANDROID_KEYSTORE if set, else
# with a new key each time (then updating needs an uninstall first).
name: Apps

on:
  push:
    # Branches only when the app changed (paths don't apply to tags); every app-v* tag.
    branches:
      - "**"
    paths:
      - "src-tauri/**"
      - ".github/workflows/apps.yml"
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the GitHub release app-v<version> (from tauri.conf.json) from this commit"
        type: boolean
        default: false

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_BODY: |
    Blob for desktop and Android: the app version of [blob.bojes.org](https://blob.bojes.org), with Blob, your notes, calendar, projects, CV and the learning centre.

    **New in this version**
    - **Calendar**: day, week, month and agenda views; drag to create, move and resize events; repeating events; your homework and exams in it.
    - **Works offline**: notes, calendar and tasks stay on the device and are saved to the cloud once you're back online.
    - **Reminders** for events, homework, exams, flashcards and your streak.
    - **Android home screen widget** "Today in Blob".
    - **Sign in with your browser**: sign the app in with the account you're already signed in to on the web.

    **Install**
    - **Windows**: `Blob_…_x64-setup.exe` (or the `.msi`). Windows may warn that the publisher is unknown: *More info → Run anyway*.
    - **macOS** (Apple silicon and Intel): `Blob_…_universal.dmg`, drag Blob into Applications. The first time macOS says it can't check Blob: open *System Settings → Privacy & Security* and choose *Open Anyway*.
    - **Linux**: `.deb` (Ubuntu, Debian), `.rpm` (Fedora) or the `.AppImage`.
    - **Android** (8.0 or newer): `Blob_…_android.apk`, allow installing from your browser or files app when asked.
    - **iPhone and iPad**: coming with the App Store.

    The apps show the live site: everything you do is the same as on the web, and what you did offline is saved to the cloud once you're back online.

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            # Not windows-2025 (windows-latest): its WebView2 can't be driven by msedgedriver
            # ("DevToolsActivePort file doesn't exist", actions/runner-images#14738).
            os: windows-2022
            args: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Unit tests of the shell
        if: matrix.name == 'Linux'
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          # Makes and fills the release (only when tagName is set).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          # A tag, or a run by hand with "release", makes the (draft) release with the installers; the
          # publish job shows it once all is green. GitHub creates the tag on this commit when it's published.
          tagName: ${{ (startsWith(github.ref, 'refs/tags/app-v') && github.ref_name) || (inputs.release && 'app-v__VERSION__') || '' }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "Blob __VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: true

      # Test the installed app the way people get it.
      - name: Test (Linux)
        if: matrix.name == 'Linux'
        run: |
          cargo install tauri-driver --locked
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" bash -c '
            tauri-driver > tauri-driver.log 2>&1 &
            sleep 3
            node src-tauri/tests/e2e/desktop.mjs --app /usr/bin/blob --out e2e-Linux --deep-link "/usr/bin/blob org.bojes.blob://show"'

      - name: Test (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          # The Edge driver that matches this machine's WebView2.
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          Write-Host "WebView2 $v"
          try { Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile edgedriver.zip }
          catch { Invoke-WebRequest "https://msedgedriver.azureedge.net/$v/edgedriver_win64.zip" -OutFile edgedriver.zip }
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          $driver = Get-ChildItem edgedriver -Recurse -Filter msedgedriver.exe | Select-Object -First 1
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -Wait $setup.FullName -ArgumentList '/S'
          $exe = "$env:LOCALAPPDATA\Blob\blob.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          New-Item -ItemType Directory -Force e2e-Windows | Out-Null

          # The installed app on its own: it starts, stays up and shows its window.
          $app = Start-Process $exe -PassThru
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\e2e-Windows\00-installed-app.png")
          Get-Process | Where-Object { $_.ProcessName -match '^(blob|msedgewebview2)$' } | Format-Table ProcessName, Id, MainWindowTitle -AutoSize | Out-String | Write-Host
          if ($app.HasExited) { throw "the app quit by itself (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id
          Start-Sleep 3
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2

          # The WebDriver checks: the app runs with its WebView2 DevTools on a port and msedgedriver
          # joins it (msedgedriver starting WebView2 apps itself is unreliable on new WebView2s).
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $app = Start-Process $exe -PassThru
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $null
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:9222/json/version | Out-Null; $up = $true } catch { Start-Sleep 1 }
          }
          if (-not $up) { throw "the app's DevTools port didn't open" }
          Start-Process $driver.FullName -ArgumentList '--port=4444', '--verbose', "--log-path=$PWD\msedgedriver.log"
          Start-Sleep 3
          node src-tauri/tests/e2e/desktop.mjs --attach 127.0.0.1:9222 --app $exe --out e2e-Windows --deep-link 'cmd /c start "" "org.bojes.blob://show"'
          $code = $LASTEXITCODE
          Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit $code }

      - name: Test (macOS)
        if: matrix.name == 'macOS'
        run: bash src-tauri/tests/e2e/macos.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/Blob.app e2e-macOS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.name }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            e2e-*/
            tauri-driver.*
            msedgedriver.log

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME) and NDKs.
      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build (APK for phones)
        run: npm run tauri -- android build --apk --target aarch64 armv7

      - name: Sign
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PASS="${ANDROID_KEY_PASSWORD:-blob-$GITHUB_RUN_ID}"
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a new key (updates need an uninstall first)."
            keytool -genkeypair -keystore release.jks -alias blob -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Blob"
          fi
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release-unsigned.apk" | head -1)
          mkdir -p dist
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "dist/Blob_${VERSION}_android.apk" aligned.apk
          "$TOOLS/apksigner" verify "dist/Blob_${VERSION}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: blob-Android
          retention-days: 14
          path: dist/*.apk

  android-test:
    name: Android (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # A debug build: its web view can be inspected, which the test needs.
      - name: Build (debug APK for the emulator)
        run: npm run tauri -- android build --debug --apk --target x86_64

      - name: Hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test in the emulator (Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node src-tauri/tests/e2e/android.mjs --apk "$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)" --out e2e-Android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-Android
          retention-days: 14
          path: e2e-Android/

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: iOS project
        run: |
          brew install xcodegen || true
          test -d src-tauri/gen/apple || npm run tauri -- ios init --ci

      # Blob's home and lock screen widgets (src-tauri/ios): the WidgetKit extension, the app group the
      # app shares with it, and the bridge that redraws them, added to the generated project.
      - name: Widgets
        run: |
          ruby src-tauri/ios/add-widget.rb
          cd src-tauri/gen/apple && xcodegen generate

      # The deep-link plugin writes the org.bojes.blob link scheme into the iOS project when its build
      # script runs; with a cached target folder it wouldn't, so it's cleaned first. (Android has the
      # same block committed in gen/android's AndroidManifest.xml.)
      - name: Build (simulator)
        run: |
          cargo clean -p tauri-plugin-deep-link --target aarch64-apple-ios-sim --manifest-path src-tauri/Cargo.toml || true
          npm run tauri -- ios build --debug --target aarch64-sim

      - name: Test in the simulator
        run: |
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion
          pip3 install --break-system-packages fb-idb || pip3 install fb-idb
          APP=$(find src-tauri/gen/apple/build -name "*.app" -type d | grep -i simulator | head -1)
          [ -n "$APP" ] || APP=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -1)
          echo "app: $APP"
          plutil -p "$APP/Info.plist" | grep -q org.bojes.blob || echo "::warning::the org.bojes.blob link scheme is missing from Info.plist"
          test -d "$APP/PlugIns/BlobWidget.appex" || { echo "::error::the widget extension is missing from the app"; exit 1; }
          plutil -p "$APP/PlugIns/BlobWidget.appex/Info.plist" | grep -q com.apple.widgetkit-extension || { echo "::error::the widget extension has no WidgetKit Info.plist"; exit 1; }
          bash src-tauri/tests/e2e/ios.sh "$APP" e2e-iOS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-iOS
          retention-days: 14
          path: e2e-iOS/

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/app-v') || inputs.release
    # The installers and the APK, once they and the Android emulator checks have passed.
    needs: [desktop, android, android-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: blob-Android
          path: android

      - name: Add the APK and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/app-v*) TAG="$GITHUB_REF_NAME" ;;
            *) TAG="app-v$(jq -r .version src-tauri/tauri.conf.json)" ;;
          esac
          gh release upload "$TAG" android/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --target "$GITHUB_SHA" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
