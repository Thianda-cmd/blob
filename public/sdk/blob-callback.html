<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Blob</title>
    <!--
      "Sign in with Blob" callback page. Put a copy of this file on your own site at the
      redirect URI you registered in Blob (for example https://example.org/blob-callback.html).
      It hands the result to the window that opened the Blob popup and closes itself; without
      a popup it stores the result and goes back to the page where sign-in started, where
      BlobAuth.handleRedirect() finishes it.
    -->
    <style>
      html { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #8b8981; background: Canvas; }
      .dot { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: #6d3df5; animation: hop 0.9s infinite ease-in-out; }
      .dot:nth-child(2) { animation-delay: 0.12s; } .dot:nth-child(3) { animation-delay: 0.24s; }
      @keyframes hop { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-6px); opacity: 1; } }
    </style>
  </head>
  <body>
    <div aria-live="polite"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <script>
      (function () {
        var url = location.href;
        try {
          if (window.opener && window.opener !== window && !window.opener.closed) {
            window.opener.postMessage({ type: "blob-auth:callback", url: url }, location.origin);
            setTimeout(function () { window.close(); }, 50);
            return;
          }
        } catch (e) {}
        var back = "/";
        try {
          localStorage.setItem("blob-auth:callback", JSON.stringify({ url: url, at: Date.now() }));
          var state = new URL(url).searchParams.get("state");
          var pending = JSON.parse(localStorage.getItem("blob-auth:pending:" + state) || "null");
          if (pending && pending.returnTo && new URL(pending.returnTo).origin === location.origin) back = pending.returnTo;
        } catch (e) {}
        location.replace(back);
      })();
    </script>
  </body>
</html>
