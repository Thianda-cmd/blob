<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>Your Blob verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f3ee;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your Blob verification code.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f3ee;">
      <tr>
        <td align="center" style="padding:36px 16px 40px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
            <tr>
              <td style="padding:0 8px 14px;">
                <img src="{{ .SiteURL }}/email/blob.png" width="105" height="79" alt="Blob" style="display:block;border:0;outline:none;" />
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border:1px solid #e3e1d9;border-radius:16px;padding:32px 32px 28px;">
                <h1 style="margin:0 0 10px;font:700 24px/1.25 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-0.4px;color:#1c1b18;">Confirm it's you</h1>
                <p style="margin:0 0 24px;font:400 15px/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#4b4a44;">{{ if .Data.full_name }}Hi {{ .Data.full_name }}!{{ else }}Hi there!{{ end }} Enter this code in Blob to confirm it's really you.</p>
          <div style="margin:0 0 8px;padding:16px 0;border-radius:12px;background:#efe9ff;text-align:center;font:700 32px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:8px;color:#5a2bd6;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 10px 0;font:400 12px/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#8b8981;">
                Didn't ask for a code? You can ignore this email.<br />
                <span style="color:#5a2bd6;font-weight:600;">Blob</span> &middot; your school, saved &middot;
                <a href="{{ .SiteURL }}" target="_blank" style="color:#8b8981;">blob.bojes.org</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
